name: Run Website URL Collector

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: Company homepage URL (blank uses seeds.csv)
        required: false
        default: ""
        type: string
      max_pages:
        description: Maximum unique pages
        required: true
        default: "3000"
        type: string
      max_depth:
        description: Maximum hierarchy depth
        required: true
        default: "12"
        type: string

permissions:
  contents: write

concurrency:
  group: website-url-collector-results
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      WEBSITE_URL: ${{ inputs.website_url }}
      MAX_PAGES: ${{ inputs.max_pages }}
      MAX_DEPTH: ${{ inputs.max_depth }}
      MAX_PAGINATION_PAGES: "2"
      MAX_LOAD_MORE_CLICKS: "1"
      MAX_RUNTIME_MINUTES: "170"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run collector
        run: python url_collector.py

      - name: Ensure result files exist
        if: ${{ always() }}
        run: |
          touch classified_pages.csv
          touch pdf_pages.csv
          touch html_pages.csv
          touch failed_pages.csv
          touch document_evidence.csv
          touch crawler.db
          touch collector.log

      - name: Create RESULTS file and Actions summary
        if: ${{ always() }}
        shell: bash
        run: |
          ACTIONS_SUMMARY="$GITHUB_STEP_SUMMARY"
          GITHUB_STEP_SUMMARY="RESULTS.md" python github_summary.py
          cat RESULTS.md >> "$ACTIONS_SUMMARY"

      - name: Commit latest RESULTS file
        if: ${{ always() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULTS.md
          if git diff --cached --quiet; then
            echo "RESULTS.md has no changes to commit."
          else
            git commit -m "Update website collector results"
            git push
          fi

      - name: Upload collector results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: url-collector-results
          path: |
            classified_pages.csv
            pdf_pages.csv
            html_pages.csv
            failed_pages.csv
            document_evidence.csv
            crawler.db
            collector.log
            RESULTS.md
          if-no-files-found: warn
          retention-days: 30
